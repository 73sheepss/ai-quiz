<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 인공지능 현재 레벨은?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .container { width: 100%; max-width: 520px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* INTRO */
  .intro-card {
    background: #fff;
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .intro-hero { margin-bottom: 1.5rem; }
  .intro-title { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 0.5rem; }
  .intro-sub { font-size: 15px; color: #666; line-height: 1.7; margin-bottom: 1.5rem; }
  .tag-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.75rem; }
  .tag { background: #f0faf5; border: 1px solid #b2e0cc; border-radius: 99px; padding: 5px 14px; font-size: 13px; color: #1a7a50; }
  .start-btn {
    width: 100%; background: #1D9E75; border: none; border-radius: 14px;
    padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  .start-btn:hover { background: #168a62; transform: translateY(-1px); }
  .start-btn:active { transform: translateY(0); }

  /* QUIZ */
  .progress-wrap { margin-bottom: 1.25rem; }
  .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 6px; }
  .progress-bar-bg { height: 7px; background: #e8eaf0; border-radius: 99px; }
  .progress-bar-fill { height: 7px; background: linear-gradient(90deg, #1D9E75, #5DCAA5); border-radius: 99px; transition: width 0.45s cubic-bezier(.4,0,.2,1); }

  .question-card {
    background: #fff;
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    margin-bottom: 1rem;
  }
  .q-scene-label { font-size: 11px; font-weight: 700; color: #1D9E75; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.75rem; }
  .q-illust {
    width: 100%; height: 160px;
    background: #f7f9fc;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .q-illust svg { width: 100%; height: 100%; }
  .q-text { font-size: 17px; font-weight: 600; color: #1a1a2e; line-height: 1.55; margin-bottom: 1.25rem; }
  .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice-btn {
    background: #f7f9fc; border: 1.5px solid #e0e4ed;
    border-radius: 14px; padding: 14px 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; text-align: center; color: #1a1a2e;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .choice-btn:hover:not(:disabled) { border-color: #1D9E75; background: #f0faf5; }
  .choice-btn.correct { background: #e6f9f1; border: 2px solid #1D9E75; color: #0a5c38; }
  .choice-btn.wrong { background: #fff0f0; border: 2px solid #e85555; color: #8b1a1a; }
  .choice-btn.reveal { background: #e6f9f1; border: 2px solid #1D9E75; color: #0a5c38; }
  .choice-btn:disabled { cursor: default; }

  .feedback-box {
    border-radius: 12px; padding: 11px 14px; margin-top: 1rem;
    font-size: 14px; line-height: 1.6; display: none;
  }
  .feedback-box.show { display: block; }
  .feedback-correct { background: #e6f9f1; color: #0a6640; }
  .feedback-wrong { background: #fff0f0; color: #922222; }

  .next-btn {
    width: 100%; background: #fff; border: 1.5px solid #dde2ee;
    border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer; color: #333; display: none; transition: all 0.15s;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: #f0faf5; border-color: #1D9E75; color: #1D9E75; }

  /* RESULT */
  .result-card {
    background: #fff; border-radius: 20px; padding: 2.5rem 2rem;
    text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .result-hero { margin-bottom: 1.25rem; }
  .score-big { font-size: 62px; font-weight: 800; color: #1a1a2e; line-height: 1; }
  .score-denom { font-size: 20px; color: #aaa; font-weight: 400; }
  .level-badge {
    display: inline-block; border-radius: 99px;
    padding: 6px 20px; font-size: 14px; font-weight: 700; margin: 0.75rem 0 0.5rem;
  }
  .level-title { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-bottom: 0.5rem; }
  .level-desc { font-size: 14px; color: #666; line-height: 1.7; max-width: 360px; margin: 0 auto 1.5rem; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 1.5rem; }
  .detail-cell { background: #f7f9fc; border-radius: 14px; padding: 14px; }
  .detail-num { font-size: 26px; font-weight: 800; }
  .detail-lbl { font-size: 12px; color: #888; margin-top: 3px; }
  .retry-btn {
    width: 100%; background: #1a1a2e; border: none; border-radius: 14px;
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; color: #fff;
    transition: background 0.15s;
  }
  .retry-btn:hover { background: #2d2d4e; }

  .emoji-icon { font-size: 36px; line-height: 1; display: block; margin-bottom: 8px; }
</style>
</head>

  <!-- QUIZ -->

    <div class="progress-wrap">
      <div class="progress-info">

    </div>
    <div class="question-card">
      <div class="q-scene-label">🔍 어떤 장면일까?</div>
      <div class="q-illust" id="q-illust"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choice-row">
        <button class="choice-btn" id="btn-yes" onclick="answer(true)">🧠 인공지능</button>
        <button class="choice-btn" id="btn-no" onclick="answer(false)">🔧 인공지능 아님</button>
      </div>
      <div class="feedback-box" id="feedback-box"></div>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 문제 →</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-hero">
        <div id="result-illust"></div>
      </div>
      <div class="score-big" id="score-num">0</div>
      <div class="score-denom">/ 10점</div>

          <div class="detail-lbl">❌ 틀린 문제</div>
        </div>
      </div>
      <button class="retry-btn" onclick="retryQuiz()">🔄 다시 도전하기</button>
    </div>
  </div>

</div>

  { text:"정해진 동작만 반복하는 공장 로봇 팔", isAI: false, reason:"같은 동작만 반복하도록 프로그램된 건 인공지능이 아니야!", illust:"robot_arm" },
  { text:"온도가 기준 이하로 내려가면 자동으로 켜지는 보일러", isAI: false, reason:"정해진 온도에서 켜지는 건 온도계와 스위치가 연결된 기계야!", illust:"boiler" },
  { text:"빨간불에 자동으로 멈추는 정해진 노선의 트램", isAI: false, reason:"신호에 따라 멈추도록 프로그램된 건 단순한 제어 장치야!", illust:"tram" },
  { text:"버튼을 누르면 노래가 나오는 뮤직박스 장난감", isAI: false, reason:"버튼을 누르면 정해진 노래가 나오는 건 단순한 기계야!", illust:"musicbox" },
];

// ── Game State ────────────────────────────────────────────────────
let questions = [], current = 0, score = 0, answered = false;

function shuffle(arr) {
  const a = [...arr];
  for(let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 10);
  current = 0; score = 0; answered = false;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('step-info').textContent = (current+1) + ' / 10';
  document.getElementById('score-live').textContent = '점수: ' + score;
  document.getElementById('prog-fill').style.width = (current/10*100) + '%';
  document.getElementById('q-illust').innerHTML = ILLUSTRATIONS[q.illust] || '';
  const btnY = document.getElementById('btn-yes');
  const btnN = document.getElementById('btn-no');
  btnY.className = 'choice-btn'; btnY.disabled = false;
  btnN.className = 'choice-btn'; btnN.disabled = false;
  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box'; fb.textContent = '';
  document.getElementById('next-btn').className = 'next-btn';
}

function answer(userSaysAI) {
  if(answered) return;
  answered = true;
  const q = questions[current];
  const correct = (userSaysAI === q.isAI);
  if(correct) score++;
  const btnY = document.getElementById('btn-yes');
  const btnN = document.getElementById('btn-no');
  btnY.disabled = true; btnN.disabled = true;
  if(userSaysAI) {
    btnY.classList.add(correct ? 'correct' : 'wrong');
    if(!correct) btnN.classList.add('reveal');
  } else {
    btnN.classList.add(correct ? 'correct' : 'wrong');
    if(!correct) btnY.classList.add('reveal');
  }
  const fb = document.getElementById('feedback-box');
  fb.textContent = (correct ? '✅ 맞았어! ' : '❌ 아쉬워! ') + q.reason;
  fb.className = 'feedback-box show ' + (correct ? 'feedback-correct' : 'feedback-wrong');
  document.getElementById('score-live').textContent = '점수: ' + score;
  const nb = document.getElementById('next-btn');
  nb.className = 'next-btn show';
  nb.textContent = current < 9 ? '다음 문제 →' : '🏆 결과 보기 →';
}

function nextQuestion() {
  current++;
  if(current >= 10) { showResult(); return; }
  renderQuestion();
}

function showResult() {
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('score-num').textContent = score;
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = 10 - score;
  let badge, title, desc, badgeStyle, emoji;
  if(score <= 3) {
    badge = "Lv.1 AI 새싹 🌱"; title = "AI 새싹";
    desc = "아직 인공지능이 무엇인지 배우는 단계야! 괜찮아, 지금부터 하나씩 알아가면 금방 잘하게 될 거야. 다시 도전해 봐!";
    badgeStyle = "background:#d1fae5; color:#065f46;";
    emoji = "🌱";
  } else if(score <= 5) {
    badge = "Lv.2 AI 탐험가 🔍"; title = "AI 탐험가";
    desc = "인공지능에 대해 조금씩 이해하고 있어! 절반 정도 맞혔는데 더 공부하면 금방 전문가가 될 거야.";
    badgeStyle = "background:#dbeafe; color:#1e40af;";
    emoji = "🔍";
  } else if(score <= 7) {
    badge = "Lv.3 AI 연구원 🔬"; title = "AI 연구원";
    desc = "인공지능을 꽤 잘 이해하고 있어! 조금만 더 공부하면 AI 전문가가 될 것 같은데?";
    badgeStyle = "background:#fef9c3; color:#854d0e;";
    emoji = "🔬";
  } else if(score <= 9) {
    badge = "Lv.4 AI 전문가 🏆"; title = "AI 전문가";
    desc = "정말 대단해! 인공지능을 아주 잘 이해하고 있어. 미래의 AI 개발자가 될 것 같은데?";
    badgeStyle = "background:#e0f2fe; color:#0369a1;";
    emoji = "🏆";
  } else {
    badge = "Lv.5 AI 천재 ⭐"; title = "AI 천재!!";
    desc = "완벽해!! 10문제 모두 맞혔어! 너는 진짜 AI 천재야. 앞으로 인공지능 분야를 이끌어 나갈 것 같아!";
    badgeStyle = "background:#f3e8ff; color:#6d28d9; border: 2px solid #a78bfa;";
    emoji = "⭐";
  }
  document.getElementById('result-illust').innerHTML =
    `<div style="font-size:56px; margin-bottom:8px;">${emoji}</div>`;
  document.getElementById('level-badge').textContent = badge;
  document.getElementById('level-badge').style.cssText = badgeStyle;
  document.getElementById('level-title').textContent = title;
  document.getElementById('level-desc').textContent = desc;
  showScreen('screen-result');
}

function retryQuiz() {
  showScreen('screen-intro');
}
</script>
